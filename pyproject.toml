[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastonto"
version = "0.1.0"
description = "LinkML modeling and read-only virtual RDF over Oracle SH"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
  "oracledb>=3,<5", "linkml>=1.9,<2", "rdflib>=7,<8", "PyYAML>=6,<7",
  "argon2-cffi>=25,<26", "cryptography>=44,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
